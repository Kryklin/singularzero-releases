<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>
  <!-- Dark void background rounded icon -->
  <rect width="128" height="128" rx="28" fill="#030712" />
  
  <!-- Outer Hypercube Hexagon -->
  <polygon points="64,36 94,53 94,87 64,104 34,87 34,53" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <line x1="64" y1="70" x2="64" y2="104" stroke="#00f0ff" stroke-width="2" />
  <line x1="64" y1="70" x2="94" y2="53" stroke="#00f0ff" stroke-width="2" />
  <line x1="64" y1="70" x2="34" y2="53" stroke="#00f0ff" stroke-width="2" />

  <!-- Inner Tesseract Hexagon -->
  <polygon points="64,52 79,61 79,79 64,88 49,79 49,61" fill="none" stroke="#7928ca" stroke-width="1.8" />

  <!-- Central Singularity Void -->
  <circle cx="64" cy="70" r="10" fill="#000000" stroke="#00f0ff" stroke-width="2" />
  <circle cx="64" cy="70" r="4" fill="#ffffff" />

  <!-- Chess King Crown -->
  <polygon points="46,39 40,24 51,29 64,17 77,29 88,24 82,39" fill="#030712" stroke="#00f0ff" stroke-width="2" />
  <!-- Apex Cross -->
  <line x1="64" y1="9" x2="64" y2="17" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="12" x2="68" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>
